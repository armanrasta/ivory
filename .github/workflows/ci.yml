# Least-privilege CI. Each job sets its own `permissions` block (authorization).
# Heavy crates (libp2p, RocksDB) stay in dedicated matrix jobs so cheap crates
# do not pay that compile cost.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: C++ toolchain (RocksDB)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libclang-dev
      - uses: Swatinem/rust-cache@v2
      - name: clippy (implemented crates)
        run: >
          cargo clippy
          -p ivory-core
          -p ivory-state
          -p ivory-storage
          -p ivory-txpool
          -p ivory-executor
          -p ivory-consensus
          -p ivory-chain
          -p ivory-crypto
          -p ivory-network
          -p ivory-rpc
          -p ivory-vm
          -p ivory
          -p ivory-dev
          -p ivory-light
          --no-deps --tests -- -D warnings

  test:
    name: test (${{ matrix.block }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - block: primitives
            packages: -p ivory-primitives -p ivory-crypto
            extra: ""
          - block: ledger
            packages: -p ivory-core -p ivory-state
            extra: ""
          - block: storage
            packages: -p ivory-storage
            extra: ""
          - block: execution
            packages: -p ivory-txpool -p ivory-executor -p ivory-vm
            extra: ""
          - block: phase3
            packages: -p ivory-consensus -p ivory-chain
            extra: ""
          - block: network
            packages: -p ivory-network
            extra: "-- --test-threads=1"
          - block: rpc
            packages: -p ivory-rpc
            extra: ""
          - block: tools
            packages: -p ivory-dev -p ivory-light
            extra: ""
          - block: node
            packages: -p ivory
            extra: "-- --test-threads=1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: C++ toolchain (RocksDB)
        if: matrix.block == 'storage' || matrix.block == 'node'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.block }}
      - name: cargo test
        run: cargo test --verbose ${{ matrix.packages }} ${{ matrix.extra }}

  coverage-cheap:
    name: coverage (core, crypto, state)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-cheap
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: llvm-cov
        run: >
          cargo llvm-cov
          -p ivory-core -p ivory-crypto -p ivory-state
          --lcov --output-path lcov.info
          --html --output-dir target/llvm-cov/html
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cheap
          path: |
            lcov.info
            target/llvm-cov/html

  coverage-exec:
    name: coverage (executor, txpool, vm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-exec
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: llvm-cov
        run: >
          cargo llvm-cov
          -p ivory-executor -p ivory-txpool -p ivory-vm
          --lcov --output-path lcov.info
          --html --output-dir target/llvm-cov/html
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-exec
          path: |
            lcov.info
            target/llvm-cov/html

  pytest:
    name: pytest (sdk/python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: sdk/python
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pytest -q
