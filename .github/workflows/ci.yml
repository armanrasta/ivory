# Least-privilege CI. Each job sets its own `permissions` block (authorization).
# Heavy crates (libp2p, RocksDB) stay in dedicated matrix jobs so cheap crates
# do not pay that compile cost.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: C++ toolchain (RocksDB)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libclang-dev
      - uses: Swatinem/rust-cache@v2
      - name: clippy (implemented crates)
        run: >
          cargo clippy
          -p ivory-core
          -p ivory-state
          -p ivory-storage
          -p ivory-txpool
          -p ivory-executor
          -p ivory-consensus
          -p ivory-chain
          -p ivory-crypto
          -p ivory-network
          -p ivory-rpc
          -p ivory-vm
          -p ivory
          --no-deps --tests -- -D warnings

  test:
    name: test (${{ matrix.block }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - block: primitives
            packages: -p ivory-primitives -p ivory-crypto
            extra: ""
          - block: ledger
            packages: -p ivory-core -p ivory-state
            extra: ""
          - block: storage
            packages: -p ivory-storage
            extra: ""
          - block: execution
            packages: -p ivory-txpool -p ivory-executor -p ivory-vm
            extra: ""
          - block: phase3
            packages: -p ivory-consensus -p ivory-chain
            extra: ""
          - block: network
            packages: -p ivory-network
            extra: "-- --test-threads=1"
          - block: rpc
            packages: -p ivory-rpc
            extra: ""
          - block: node
            packages: -p ivory
            extra: "-- --test-threads=1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: C++ toolchain (RocksDB)
        if: matrix.block == 'storage' || matrix.block == 'node'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.block }}
      - name: cargo test
        run: cargo test --verbose ${{ matrix.packages }} ${{ matrix.extra }}
