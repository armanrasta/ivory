[project]
name = "ivory-client"
version = "0.1.0"
description = "Pure-Python JSON-RPC client for Ivory (Ed25519 + bincode raw txs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pynacl>=1.5",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ivory_client*"]
